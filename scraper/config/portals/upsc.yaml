# ==============================================================================
# UPA-GURU Government Portal Configuration: UPSC
# Union Public Service Commission
# ==============================================================================

portal_code: "UPSC"
portal_name: "Union Public Service Commission"
conducting_body: "UPSC"
state_or_central: "Central"
official_website: "https://upsc.gov.in"
notifications_url: "https://upsc.gov.in/examinations/active-examinations"

# Crawl Engine Configuration
engine: "playwright"
headless: true
timeout_seconds: 40
request_delay_seconds: 2.5
max_retries: 3
max_pages: 3

# DOM Extraction Selectors
wait_selector: "table, .view-content, a[href$='.pdf']"
selectors:
  container: "table.views-table tbody tr, .view-content tbody tr, .region-content table tr"
  pdf_link: "a[href$='.pdf'], a[href*='.pdf'], a[href*='Notification']"
  title: "td:nth-child(1), td.views-field-title, a"
  publish_date: "td:nth-child(2), td.views-field-field-exam-date"
  notification_number: "td:nth-child(1) a"

# URL Canonicalization Rules
base_url: "https://upsc.gov.in"
relative_url_prefix: "https://upsc.gov.in/"

# Keyword Filters
include_keywords:
  - "examination"
  - "notification"
  - "civil services"
  - "engineering services"
  - "combined defense"
  - "nda"
  - "cds"
  - "capf"
  - "forest service"
  - "advertisement"
exclude_keywords:
  - "final result"
  - "written result"
  - "interview schedule"
  - "marks of recommended"
  - "admit card"
